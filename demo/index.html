<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>m2diff-viewer: code and data diff viewer for React</title>
    <meta
      name="description"
      content="A code and data diff viewer for React: side-by-side, inline and unified views, word-level highlighting, merge arrows, a command palette, and JSON & CSV diffs."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%277%27 height=%2716%27 rx=%272%27 fill=%27%23dc6461%27/%3E%3Crect x=%279%27 width=%277%27 height=%2716%27 rx=%272%27 fill=%27%234fae6c%27/%3E%3C/svg%3E"
    />
    <script>
      // A visitor's own choice (the theme toggle) wins; otherwise follow the system.
      try {
        var choice = localStorage.getItem('m2diff-site:theme');
        document.documentElement.dataset.theme =
          choice === 'light' || choice === 'dark' ? choice : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
